<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shroom SDK · 最小示例</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f14;
        color: #e6edf3;
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .app { width: min(920px, 92vw); }
      h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
      .sub { color: #7d8590; margin: 0 0 20px; }
      .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
      button {
        padding: 8px 16px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #21262d;
        color: #e6edf3;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #30363d; }
      button.primary { background: #238636; border-color: #238636; }
      button.primary:hover { background: #2ea043; }
      select { padding: 8px; border-radius: 6px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; font: inherit; }
      .stage { display: grid; grid-template-columns: 1fr 200px; gap: 16px; }
      canvas {
        width: 100%;
        aspect-ratio: 1;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        display: block;
      }
      .stats { border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; }
      .stats dt { color: #7d8590; font-size: 12px; }
      .stats dd { margin: 0 0 10px; font-size: 18px; font-variant-numeric: tabular-nums; }
      #status { color: #7d8590; max-width: 46ch; }
      #status.warn { color: #f0883e; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .note {
        display: none;
        margin: 0 0 16px;
        padding: 10px 14px;
        border: 1px solid #9e6a03;
        border-left-width: 3px;
        border-radius: 6px;
        background: #1c1810;
        color: #d8c3a0;
      }
      .note.show { display: block; }
      .note code { color: #fde68a; font-family: ui-monospace, Consolas, monospace; }
      .gain { display: flex; align-items: center; gap: 6px; color: #7d8590; }
      .gain input { width: 90px; }
      .gain b { color: #e6edf3; font-variant-numeric: tabular-nums; min-width: 2ch; }
      .stats dd.diag { font-size: 13px; line-height: 1.5; color: #7d8590; }
      .stats dd.diag span { color: #e6edf3; font-variant-numeric: tabular-nums; }
      .stats dd.hint { font-size: 12px; color: #f0883e; margin-top: -4px; }
      @media (max-width: 700px) { .stage { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Shroom SDK · 最小示例</h1>
      <p class="sub">连接串口 → 拿到数据 → 画成热力图。整个页面的逻辑就是下面那段 script。</p>

      <p class="note" id="filenote">
        你是双击打开这个文件的（<code>file://</code>）。模拟数据能正常跑，但<b>连不了真实设备</b>——
        浏览器规定串口只在 <code>https</code> 或 <code>localhost</code> 下开放，这条绕不过去。
        要连设备：回到 SDK 根目录，双击 <code>start-demo.bat</code>（macOS / Linux 是 <code>sh start.sh</code>）。
      </p>

      <div class="bar">
        <button class="primary" id="connect">连接设备</button>
        <button id="mock">用模拟数据</button>
        <button id="stop">断开</button>
        <select id="baud" title="波特率：连上但没画面时换这个">
          <option value="1000000">1000000（默认）</option>
          <option value="921600">921600（手套 / 机器人）</option>
          <option value="1500000">1500000</option>
          <option value="3000000">3000000</option>
          <option value="460800">460800</option>
          <option value="115200">115200</option>
        </select>
        <select id="mode">
          <option value="dots">点阵</option>
          <option value="heat">热力</option>
          <option value="grid">网格</option>
        </select>
        <select id="colormap">
          <option value="jet">jet 彩虹</option>
          <option value="jetWhite">jetWhite 白底</option>
          <option value="grey">grey 灰度</option>
        </select>
        <label class="gain">增益 <input id="gain" type="range" min="1" max="8" step="0.5" value="1" /><b id="gainv">1</b></label>
        <label class="gain" id="tiltbox" title="俯视角：越大越像正俯视，方阵看着越方">
          视角 <input id="tilt" type="range" min="45" max="85" step="5" value="70" /><b id="tiltv">70°</b>
          <input id="flip" type="checkbox" checked title="按下面却是上面鼓起来，就点掉它" />前后翻转
        </label>
        <span id="status">未连接</span>
      </div>

      <div class="stage">
        <canvas id="view"></canvas>
        <dl class="stats">
          <dt>最大值</dt><dd id="max">—</dd>
          <dt>平均值</dt><dd id="avg">—</dd>
          <dt>受力点数</dt><dd id="area">—</dd>
          <dt>帧率</dt><dd id="fps">—</dd>
          <dt>数据流</dt>
          <dd class="diag">
            <span id="bytes">0</span> 字节<br />
            <span id="frames">0</span> 帧 / 丢 <span id="dropped">0</span>
          </dd>
          <dd class="hint" id="diaghint"></dd>
        </dl>
      </div>
    </div>

    <!--@INLINE_BUNDLE@-->

    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };

        // 正常情况下 SDK 代码就内联在这个文件里，走不到这里；留个兜底免得白屏
        if (typeof Shroom === 'undefined') {
          $('status').textContent = 'SDK 代码没加载起来，按 F12 打开 Console 看报错';
          $('status').className = 'warn';
          $('connect').disabled = true;
          $('mock').disabled = true;
          return;
        }

        var heatmap = Shroom.createHeatmap('#view', { mode: 'dots' });
        var device = null;
        var frames = 0;
        var lastTick = performance.now();
        var shape = null;

        function attach(dev, label) {
          device = dev;
          $('status').textContent = label;
          $('status').className = '';
          dev.onFrame(function (frame) {
            heatmap.render(frame);
            shape = frame;
            $('max').textContent = frame.max.toFixed(3);
            $('avg').textContent = frame.avg.toFixed(3);
            $('area').textContent = frame.area;
            frames += 1;
          });
        }

        function stop() {
          var closing = device ? device.close() : Promise.resolve();
          device = null;
          shape = null;
          return Promise.resolve(closing).then(function () {
            heatmap.clear();
            $('status').textContent = '未连接';
            $('status').className = '';
            ['max', 'avg', 'area', 'fps'].forEach(function (id) {
              $(id).textContent = '—';
            });
            $('bytes').textContent = $('frames').textContent = $('dropped').textContent = '0';
            $('diaghint').textContent = '';
          });
        }

        $('connect').onclick = function () {
          // 第一件事就是弹串口选择框，前面别 await，否则可能丢掉用户手势
          Shroom.connect({ baudRate: Number($('baud').value) }).then(
            function (dev) {
              return stop().then(function () { attach(dev, '已连接串口'); });
            },
            function (err) {
              var canceled = /No port selected|cancell?ed/i.test(err.message);
              $('status').textContent = canceled ? '你取消了选择' : '连接失败：' + err.message;
              $('status').className = 'warn';
            }
          );
        };

        $('mock').onclick = function () {
          stop().then(function () {
            attach(Shroom.mock({ rows: 32, cols: 32, fps: 30 }), '模拟数据运行中');
          });
        };

        $('stop').onclick = stop;
        $('colormap').onchange = function (e) {
          heatmap.setOptions({ colormap: e.target.value });
        };
        $('mode').onchange = function (e) {
          heatmap.setOptions({ mode: e.target.value });
          // 视角只对点阵有意义，换成热力/网格就把它收起来
          $('tiltbox').style.display = e.target.value === 'dots' ? '' : 'none';
        };
        $('tilt').oninput = function (e) {
          $('tiltv').textContent = e.target.value + '°';
          heatmap.setOptions({ tilt: Number(e.target.value) });
        };
        $('flip').onchange = function (e) {
          heatmap.setOptions({ flipY: e.target.checked });
        };
        $('gain').oninput = function (e) {
          $('gainv').textContent = e.target.value;
          heatmap.setOptions({ gain: Number(e.target.value) });
        };

        // 「连上了但没画面」全靠这几个数字定位：
        // 字节不涨 = 设备没发；字节涨帧不涨 = 波特率/分隔符不对；都涨 = 数据没问题
        function diagnose() {
          if (!device || device.bytesReceived === undefined) {
            $('diaghint').textContent = '';
            return;
          }
          var bytes = device.bytesReceived;
          var got = device.frameCount;
          $('bytes').textContent = bytes;
          $('frames').textContent = got;
          $('dropped').textContent = device.droppedCount;
          if (bytes === 0) {
            $('diaghint').textContent = '设备没在发数据 —— 确认选对了 COM 口';
          } else if (got === 0) {
            $('diaghint').textContent = '有数据但切不出帧 —— 换个波特率再连一次';
          } else if (shape && shape.rows === 1 && shape.cols > 64) {
            // 帧长不是完全平方数，推断不出方阵，退化成了 1×N 一条横线
            $('diaghint').textContent =
              '帧长 ' + shape.cols + ' 字节，不是完全平方数，画成了一条横线 —— ' +
              '在 connect() 里显式写上 rows / cols';
          } else {
            $('diaghint').textContent = '';
          }
        }

        setInterval(function () {
          var now = performance.now();
          $('fps').textContent = device ? Math.round((frames * 1000) / (now - lastTick)) : '—';
          frames = 0;
          lastTick = now;
          diagnose();
        }, 1000);

        // 串口用不了的三种情况，说法不一样，解决办法也不一样
        if (!Shroom.isSupported()) {
          $('connect').disabled = true;
          if (location.protocol === 'file:') {
            $('filenote').className = 'note show';
            $('status').textContent = '双击打开的，串口用不了；点「用模拟数据」照样能看效果';
          } else if (!window.isSecureContext) {
            $('status').textContent = '当前地址不是 https 或 localhost，浏览器不开放串口，可以先点「用模拟数据」';
          } else {
            $('status').textContent = '此浏览器没有 Web Serial（需要 Chrome / Edge），可以先点「用模拟数据」';
          }
          $('status').className = 'warn';
        }
      })();
    </script>
  </body>
</html>
